{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="empty-state error-state">
  <span class="error-code">{{ code }}</span>
  <h1>{{ message }}</h1>
  <p>Go back to your reports and try again.</p>
  <a class="button button-primary" href="{{ url_for('dashboard') }}">Back to reports</a>
</section>
{% endblock %}
